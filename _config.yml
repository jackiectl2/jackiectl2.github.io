# External plugins.
# jekyll-archives and jekyll-paginate-v2 are NOT on the GitHub Pages allowlist,
# so this site must be built by CI (GitHub Actions), not by Pages itself.
plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-paginate-v2

exclude:
  - "/vendor/"
  - Gemfile
  - Gemfile.lock
  - tools
  - README.md
  - LICENSE.md

# Site settings
title: Tianlang (Jackie) Chen
subtitle: "Data Science @ Michigan"
email: ctlang@umich.edu
name: Tianlang (Jackie) Chen
description: >
  Tianlang (Jackie) Chen — B.S.E. Data Science at the University of Michigan.
  LLM-guided incentive design, genomic foundation models, and AI-guided
  environmental sensing.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jackiectl.github.io" # the base hostname & protocol for your site

# This site's own host. The colophon points at what is coming NEXT, so it skips
# any coming_soon entry that is just this site.
domain: jackiectl.github.io

# Build settings
markdown: kramdown
inter_post_navigation: true
highlightjs_theme: "github"

# Left-rail navigation. The anchors live on the homepage, so they resolve from
# any page on the site.
nav:
  - label: work
    url: /#work
  - label: publications
    url: /#publications
  - label: experience
    url: /#experience
  - label: skills
    url: /#skills
  - label: writing
    url: /blog/
  - label: contact
    url: /#contact

# The glyph carved into the seal at the top of the rail. Brand mark, not code —
# set it to whatever you want stamped there, or "" to drop the seal entirely.
seal: "陳"

# The scan line under the lede on the homepage.
focus:
  - LLM-guided incentive design
  - genomic foundation models
  - environmental sensing

# Pagination Settings
# https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"
  sort_reverse: true

# Archive settings (see https://github.com/jekyll/jekyll-archives/)
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: 'archive'
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'

# Disqus comments
# disqus_shortname: jackiectl

# Google analytics
# ga_tracking_id: "UA-XXXX-1"
